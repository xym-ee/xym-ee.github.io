  <div class="gallery-lightbox" role="dialog" aria-modal="true" aria-label="Image preview" hidden>
    <button class="gallery-lightbox-close" type="button" aria-label="Close image preview">&times;</button>
    <button class="gallery-lightbox-nav gallery-lightbox-prev" type="button" aria-label="Previous image">&lsaquo;</button>
    <figure class="gallery-lightbox-figure">
      <img class="gallery-lightbox-img" alt="">
      <figcaption class="gallery-lightbox-caption"></figcaption>
      <a class="gallery-lightbox-original" href="#" target="_blank" rel="noopener">Open original</a>
    </figure>
    <button class="gallery-lightbox-nav gallery-lightbox-next" type="button" aria-label="Next image">&rsaquo;</button>
  </div>

  <script>
    (function () {
      const links = Array.from(document.querySelectorAll('.gallery-link[data-lightbox]'));
      const lightbox = document.querySelector('.gallery-lightbox');
      if (!links.length || !lightbox) return;

      const image = lightbox.querySelector('.gallery-lightbox-img');
      const caption = lightbox.querySelector('.gallery-lightbox-caption');
      const original = lightbox.querySelector('.gallery-lightbox-original');
      const closeButton = lightbox.querySelector('.gallery-lightbox-close');
      const prevButton = lightbox.querySelector('.gallery-lightbox-prev');
      const nextButton = lightbox.querySelector('.gallery-lightbox-next');
      let activeIndex = 0;
      let lastFocused = null;

      function showImage(index) {
        activeIndex = (index + links.length) % links.length;
        const link = links[activeIndex];
        const thumb = link.querySelector('img');
        const alt = thumb ? thumb.getAttribute('alt') || '' : '';

        image.src = link.href;
        image.alt = alt;
        caption.textContent = alt;
        original.href = link.href;
      }

      function openLightbox(index) {
        lastFocused = document.activeElement;
        showImage(index);
        lightbox.hidden = false;
        document.documentElement.classList.add('gallery-lightbox-open');
        closeButton.focus();
      }

      function closeLightbox() {
        lightbox.hidden = true;
        image.removeAttribute('src');
        document.documentElement.classList.remove('gallery-lightbox-open');
        if (lastFocused) lastFocused.focus();
      }

      links.forEach((link, index) => {
        link.addEventListener('click', event => {
          event.preventDefault();
          openLightbox(index);
        });
      });

      closeButton.addEventListener('click', closeLightbox);
      prevButton.addEventListener('click', () => showImage(activeIndex - 1));
      nextButton.addEventListener('click', () => showImage(activeIndex + 1));

      lightbox.addEventListener('click', event => {
        if (event.target === lightbox) closeLightbox();
      });

      document.addEventListener('keydown', event => {
        if (lightbox.hidden) return;
        if (event.key === 'Escape') closeLightbox();
        if (event.key === 'ArrowLeft') showImage(activeIndex - 1);
        if (event.key === 'ArrowRight') showImage(activeIndex + 1);
        if (event.key === 'Tab') {
          const focusable = [closeButton, prevButton, original, nextButton];
          const first = focusable[0];
          const last = focusable[focusable.length - 1];

          if (event.shiftKey && document.activeElement === first) {
            event.preventDefault();
            last.focus();
          } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault();
            first.focus();
          }
        }
      });
    })();
  </script>
