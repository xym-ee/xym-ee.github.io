  <script>
  (function() {
    const titleText = "Embedded Systems & Robot Control";
    const descText = "In-depth Insights into Computer Technology and Intelligent Control: From Low-Level Development to High-Level Applications";
    const promptDelay = 800;
    const titleDuration = 800;
    const descDuration = 800;
    const menuRevealDelay = 50;
    const socialRevealDelay = 50;

    const titleEl = document.getElementById('typewriter-title');
    const descEl = document.getElementById('typewriter-desc');

    function typeText(element, text, duration, onComplete) {
      if (!element) return;

      const delay = duration / Math.max(text.length, 1);
      let current = 0;

      function typeNext() {
        if (current < text.length) {
          current++;
          element.textContent = text.slice(0, current);
          setTimeout(typeNext, delay);
          return;
        }

        if (onComplete) {
          onComplete();
        }
      }

      typeNext();
    }

    function revealItems(selector, delay, onComplete) {
      const items = Array.from(document.querySelectorAll(selector));
      let current = 0;

      function revealNext() {
        if (current < items.length) {
          const item = items[current];
          item.classList.add('is-visible');
          item.removeAttribute('inert');
          item.setAttribute('aria-hidden', 'false');
          current++;
          setTimeout(revealNext, delay);
          return;
        }

        if (onComplete) {
          onComplete();
        }
      }

      revealNext();
    }

    function typeTitle() {
      typeText(titleEl, titleText, titleDuration, function() {
        setTimeout(typeDesc, 120);
      });
    }

    function typeDesc() {
      typeText(descEl, descText, descDuration, function() {
        revealItems('.menu-item', menuRevealDelay, function() {
          revealItems('.social-item', socialRevealDelay);
        });
      });
    }

    setTimeout(typeTitle, promptDelay);
  })();
  </script>
