<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://*.disqus.com https://*.disquscdn.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; img-src 'self' https: data:; media-src 'self' https: data:; frame-src https://*.disqus.com https://disqus.com https://player.bilibili.com https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://www.dailymotion.com; connect-src 'self' https://*.disqus.com https://*.disquscdn.com; font-src 'self' https: data:; object-src 'none'; base-uri 'self'; form-action 'self' https://*.disqus.com">
  <title>3D 知识网络 | xym-ee</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; }
    #info-panel {
      position: fixed; top: 80px; left: 20px;
      background: rgba(0,0,0,0.9); border: 1px solid rgba(34,197,94,0.3);
      border-radius: 8px; padding: 16px; max-width: 300px;
      opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100;
    }
    #info-panel.visible { opacity: 1; pointer-events: auto; }
    #node-title { color: #4ade80; font-weight: bold; font-size: 18px; margin-bottom: 8px; }
    #node-desc { color: #d1d5db; font-size: 14px; }
    #node-link { color: #60a5fa; font-size: 14px; margin-top: 8px; display: inline-block; }
    .instructions { position: fixed; bottom: 20px; left: 20px; color: #6b7280; font-size: 12px; z-index: 100; }
    .back-btn { position: fixed; top: 20px; right: 20px; z-index: 100; }
    .back-btn a { color: #60a5fa; font-size: 14px; text-decoration: none; padding: 8px 16px; background: rgba(0,0,0,0.8); border-radius: 6px; }
    .back-btn a:hover { color: #93c5fd; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; z-index: 200; }
    #loading.hidden { opacity: 0; transition: opacity 0.5s; pointer-events: none; }
    .loading-text { color: #22c55e; font-size: 20px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  </style>
</head>
<body>
  <div id="loading"><div class="loading-text">Loading knowledge network...</div></div>

  <div id="canvas-container"></div>

  <div class="back-btn"><a href="/notebook.html">← 返回目录</a></div>

  <div id="info-panel">
    <div id="node-title"></div>
    <div id="node-desc"></div>
    <a id="node-link" href="" target="_blank">Visit Link →</a>
  </div>

  <div class="instructions">🖱 Drag to rotate | 🔍 Scroll to zoom | Click nodes for details | ESC to close</div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
var knowledgeData = null;

function loadData() {
  fetch('/knowledge-graph.json')
    .then(function(response) { return response.json(); })
    .then(function(data) {
      knowledgeData = data;
      init();
    });
}

// Data now loaded from /knowledge-graph.json

var categoryColors = { control: 0x3b82f6, electronics: 0x22c55e, computer: 0xf97316, math: 0xa855f7 };
var scene, camera, renderer, controls;
var nodes = [], links = [];
var nodeGroup, linkGroup;
var raycaster, mouse;
var selectedNode = null, hoveredNode = null;

function init() {
  var container = document.getElementById('canvas-container');
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 2, 12);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setClearColor(0x000000, 1);
  container.appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.minDistance = 5;
  controls.maxDistance = 25;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.3;

  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();

  createBackground();
  createNodes();
  createLinks();
  createLights();

  window.addEventListener('resize', onWindowResize);
  renderer.domElement.addEventListener('mousemove', onMouseMove);
  renderer.domElement.addEventListener('click', onClick);
  document.addEventListener('keydown', function(e) { if(e.key === 'Escape') window.close(); });

  setTimeout(function() {
    document.getElementById('loading').classList.add('hidden');
  }, 1500);

  animate();
}

function createBackground() {
  var g = new THREE.BufferGeometry();
  var p = new Float32Array(2000 * 3);
  for (var i = 0; i < 2000 * 3; i += 3) {
    p[i] = (Math.random() - 0.5) * 100;
    p[i + 1] = (Math.random() - 0.5) * 60;
    p[i + 2] = (Math.random() - 0.5) * 100;
  }
  g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 0.08, transparent: true, opacity: 0.8 })));
}

function createNodes() {
  nodeGroup = new THREE.Group();
  knowledgeData.nodes.forEach(function(d, i) {
    var geo = new THREE.SphereGeometry(d.size * 0.25, 32, 32);
    var col = categoryColors[d.category] || 0x888888;
    var mat = new THREE.MeshPhongMaterial({ color: col, emissive: col, emissiveIntensity: 0.3, shininess: 100, transparent: true, opacity: 0.9 });
    var sphere = new THREE.Mesh(geo, mat);
    sphere.position.set(d.x, d.y, d.z);
    sphere.userData = { id: d.id, desc: d.desc, link: d.link, index: i };
    sphere.add(new THREE.Mesh(new THREE.SphereGeometry(d.size * 0.35, 32, 32), new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.15 })));
    nodes.push(sphere);
    nodeGroup.add(sphere);
    sphere.scale.set(0, 0, 0);
    setTimeout(function() { animateScale(sphere, 1); }, 300 + i * 50);
  });
  scene.add(nodeGroup);
}

function animateScale(obj, t) {
  var start = Date.now(), dur = 800;
  function run() {
    var p = Math.min((Date.now() - start) / dur, 1);
    var e = 1 - Math.pow(1 - p, 3);
    obj.scale.set(e, e, e);
    if (p < 1) requestAnimationFrame(run);
  }
  run();
}

function createLinks() {
  linkGroup = new THREE.Group();
  var m = {};
  nodes.forEach(function(n) { m[n.userData.id] = n; });

  knowledgeData.links.forEach(function(d, i) {
    var s = m[d.source], t = m[d.target];
    if (s && t) {
      var tube = new THREE.Mesh(
        new THREE.TubeGeometry(new THREE.LineCurve3(s.position.clone(), t.position.clone()), 1, 0.02 + d.strength * 0.02, 8, false),
        new THREE.MeshBasicMaterial({ color: 0x444444, transparent: true, opacity: 0.3 + d.strength * 0.3 })
      );
      tube.userData = d;
      tube.scale.set(0, 0, 0);
      setTimeout(function() { animateScale(tube, 1); }, 800 + i * 20);
      links.push(tube);
      linkGroup.add(tube);
    }
  });
  scene.add(linkGroup);
}

function createLights() {
  scene.add(new THREE.AmbientLight(0x404040, 0.5));
  var lights = [[0x3b82f6, 10, 10, 10], [0x22c55e, -10, -10, 10], [0xf97316, 10, -10, -10]];
  lights.forEach(function(c) {
    var l = new THREE.PointLight(c[0], 1, 25);
    l.position.set(c[1], c[2], c[3]);
    scene.add(l);
  });
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function onMouseMove(e) {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  var hits = raycaster.intersectObjects(nodes);
  if (hoveredNode && hoveredNode !== selectedNode) hoveredNode.scale.set(1,1,1);
  if (hits.length > 0) {
    hoveredNode = hits[0].object;
    if (hoveredNode !== selectedNode) hoveredNode.scale.set(1.2,1.2,1.2);
    renderer.domElement.style.cursor = 'pointer';
  } else {
    hoveredNode = null;
    renderer.domElement.style.cursor = 'grab';
  }
}

function onClick(e) {
  raycaster.setFromCamera(mouse, camera);
  var hits = raycaster.intersectObjects(nodes);
  if (selectedNode) selectedNode.scale.set(1,1,1);
  var panel = document.getElementById('info-panel');
  if (hits.length > 0) {
    selectedNode = hits[0].object;
    selectedNode.scale.set(1.3,1.3,1.3);
    var d = selectedNode.userData;
    document.getElementById('node-title').textContent = d.id;
    document.getElementById('node-desc').textContent = d.desc || 'No description';
    var l = document.getElementById('node-link');
    if (d.link) { l.href = d.link; l.style.display = 'inline-block'; } else { l.style.display = 'none'; }
    panel.classList.add('visible');
    links.forEach(function(L) {
      if (L.userData.source === d.id || L.userData.target === d.id) {
        L.material.color.setHex(0x44ff44);
        L.material.opacity = 0.8;
      } else {
        L.material.color.setHex(0x444444);
        L.material.opacity = 0.1;
      }
    });
  } else {
    selectedNode = null;
    panel.classList.remove('visible');
    links.forEach(function(L) {
      L.material.color.setHex(0x444444);
      L.material.opacity = 0.3 + L.userData.strength * 0.3;
    });
  }
}

function animate() {
  requestAnimationFrame(animate);
  nodes.forEach(function(n, i) { n.position.y += Math.sin(Date.now() * 0.001 + i) * 0.002; });
  controls.update();
  renderer.render(scene, camera);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', loadData);
} else {
  init();
}
  </script>
</body>
</html>
